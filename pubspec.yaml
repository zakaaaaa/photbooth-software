name: photobooth_app
description: A Flutter photobooth application for desktop
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http_parser: ^4.0.0
  window_manager: ^0.4.3
  screen_retriever: ^0.2.0
  
  # Camera - cross platform
  
  # Image processing
  image: ^4.1.7
  
  # State management
  provider: ^6.1.2
  
  # Utils
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.19.0
  url_launcher: ^6.2.0
  process_run: ^1.1.0
  
  # UI
  flutter_colorpicker: ^1.0.3
  qr_flutter: ^4.1.0
  
  # PDF & Print
  printing: ^5.12.0
  pdf: ^3.10.8
  file_picker: ^6.1.1
  
  # Device info & Permission
  permission_handler: ^11.3.1
  device_info_plus: ^12.3.0
  
  # Network
  http: ^1.2.0
  mailer: ^6.0.1
  camera: ^0.12.0+1
  camera_windows: ^0.2.6+4
  webview_windows: ^0.4.0

  # Video playback (Windows desktop) — video_player tidak mendukung Windows
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/filters/
    - assets/frames/
    - assets/bin/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Ambitsek
      fonts:
        - asset: assets/fonts/ambitsek.ttf
    - family: Pixeland
      fonts:
        - asset: assets/fonts/Pixeland.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: Bristol
      fonts:
        - asset: assets/fonts/Bristol.otf
